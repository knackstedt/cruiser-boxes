name: Release

on:
  push:
    # e.g. v1.0.0 — prerelease tags (v1.0.0-rc.1) publish as prereleases.
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    name: package + publish
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: ./.github/actions/downdraft-deps

      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.TAG.replace(/^v/, "");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(`version -> ${version}`);
          '

      - uses: dtolnay/rust-toolchain@stable

      - name: Install toolchain build deps
        # aptBuildDeps in toolchain/versions.json — the QEMU 11 source build
        # below needs them (system qemu is too old to ship).
        run: |
          sudo apt-get update
          sudo apt-get install -y $(node -e 'console.log(JSON.parse(require("fs").readFileSync("toolchain/versions.json","utf8")).aptBuildDeps.join(" "))')

      - name: Build + stage the opt/ toolchain
        # From-source QEMU 11 + virglrenderer/spice/freerdp (~30-60min), then
        # pruned to release/opt/ (x86_64 only, stripped, licenses collected).
        # package.json build.files copies release/opt → <appdir>/opt where
        # vm-core's optDir() probes dirname(process.execPath)/opt.
        run: |
          bun run toolchain build
          bun run opt:stage

      - name: Install X11/GLES dev libs
        # viewer-dd's own #[link] externs need the dev .so symlinks
        # (-lGLESv2, -lX11) — cargo check passes without them, the release
        # link doesn't.
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgles-dev

      - name: Build + stage viewer-dd
        # native/dist/<plat>-<arch>/ is copied to <appdir>/native/ by the
        # packager's game-native convention; ddViewerPath() probes it there.
        run: bun run viewer-dd:stage

      - name: Build + stage term-dd
        # Same native/dist convention — host-int's termDdPath() probes it.
        run: bun run term-dd:stage

      - name: Bundle xterm terminal page
        # term-bundle.gen.ts is committed as a stub; regenerate for release
        # so the embedded terminal has a real page to load.
        run: bun run term:bundle

      - name: Package (deb + AppImage via draft release)
        # Formats come from build.linux.target in package.json; runtime from
        # downdraft.config.json ("node" — emit-tree + shipped node binary).
        run: bunx draft release --target=linux

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          artifacts=(release/*.deb release/*.AppImage release/*.flatpak)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts found in release/" >&2
            ls -la release/ >&2 || true
            exit 1
          fi
          args=(--title "$TAG" --generate-notes)
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" "${artifacts[@]}"
