[package]
name = "ddproto"
version = "0.1.0"
edition = "2021"
description = "Shared QEMU org.qemu.Display1 p2p protocol — QMP channel open, listener/clipboard skeletons"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio", "p2p", "blocking-api", "async-io"] }
zvariant = "5"
anyhow = "1"
nix = { version = "0.30", features = ["socket", "uio"] }
libc = "0.2"
