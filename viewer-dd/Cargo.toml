[package]
name = "viewer-dd"
version = "0.1.0"
edition = "2021"
description = "Cruiser direct-display viewer — QEMU D-Bus dma-buf scanout presented via EGL"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio", "p2p", "blocking-api", "async-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
zvariant = "5"
anyhow = "1"
nix = { version = "0.30", features = ["socket", "uio"] }
libc = "0.2"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
once_cell = "1"
minifb = "0.29.0"
raw-window-handle = "0.6.2"
# host clipboard for the qemu-vdagent bridge — x11rb on X11, wl-clipboard-rs
# under Wayland (both pure-rust; no wayland-client C libs)
arboard = { version = "3.6", features = ["wl-clipboard-rs"] }

[profile.release]
opt-level = 3
lto = true
