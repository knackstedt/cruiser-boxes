name: "Install deps (npm @downdraft)"
description: >
  Installs dependencies with @downdraft/* pinned to a published npm version.
  package.json already carries npm specs — local dev overrides them via a
  postinstall symlink into a sibling engine checkout, which CI lacks — so
  this action mainly serves to pin a different @downdraft version when the
  downdraft-version input is provided.
inputs:
  downdraft-version:
    description: "npm version spec for @downdraft/* packages"
    required: false
    default: "^0.5.0"
runs:
  using: "composite"
  steps:
    - name: Point @downdraft/* deps at the npm registry
      shell: bash
      env:
        DD_VERSION: ${{ inputs.downdraft-version }}
      run: |
        node -e '
          const fs = require("fs");
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          const want = process.env.DD_VERSION;
          for (const sec of ["dependencies", "devDependencies"]) {
            for (const [name, spec] of Object.entries(pkg[sec] ?? {})) {
              if (name.startsWith("@downdraft/")) {
                console.log(`${name}: ${spec} -> ${want}`);
                pkg[sec][name] = want;
              }
            }
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
        '

    - name: Install dependencies
      shell: bash
      # Not --frozen-lockfile: a downdraft-version pin rewrites the manifest,
      # so the lockfile may need re-resolving.
      run: bun install
