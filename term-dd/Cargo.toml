[package]
name = "term-dd"
version = "0.1.0"
edition = "2021"
description = "Cruiser guest terminal — PTY proxy bridging a guest ssh session to length-prefixed stdio frames"

[dependencies]
portable-pty = "0.9"
anyhow = "1"
nix = { version = "0.30", features = ["term", "signal", "ioctl"] }
libc = "0.2"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = true
